spring.application.name=demo
server.port=8181
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://db:5432/Book}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${DATABASE_DIALECT:org.hibernate.dialect.HibernateDialect}